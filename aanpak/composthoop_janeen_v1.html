<!DOCTYPE html>
<html lang="nl" data-root="../">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wat mag op de composthoop? — Ecologisch tuinieren · Chaostuinieren</title>
  <meta name="description" content="Wat mag wel en niet op de composthoop, met composteertijd en de reden waarom.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .compost-wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }

    /* Zoekbalk */
    .compost-search-wrap {
      margin-bottom: 2rem;
      position: relative;
    }
    .compost-search {
      width: 100%;
      padding: 0.85rem 1.25rem 0.85rem 3rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      border: 1px solid var(--fog);
      border-radius: 3px;
      background: white;
      color: #3a3020;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .compost-search:focus { border-color: var(--straw); }
    .compost-search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--sage);
      pointer-events: none;
    }
    .compost-search-result {
      margin-top: 0.75rem;
      padding: 1rem 1.25rem;
      border-radius: 3px;
      font-size: 0.95rem;
      display: none;
    }
    .compost-search-result.ja {
      background: #eef5e8;
      border-left: 3px solid var(--moss);
      color: #2a4015;
    }
    .compost-search-result.nee {
      background: #fdf0ec;
      border-left: 3px solid #c0522a;
      color: #6b2a10;
    }
    .compost-search-result.niets {
      background: var(--fog);
      border-left: 3px solid var(--straw);
      color: #5a4a30;
    }

    /* Tabbladen */
    .compost-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--fog);
      padding-bottom: 0;
    }
    .compost-tab {
      padding: 0.75rem 1.5rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--sage);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .compost-tab.active {
      color: var(--moss);
      border-bottom-color: var(--moss);
    }
    .compost-tab:hover { color: var(--moss); }

    /* Tabinhoud */
    .compost-panel { display: none; }
    .compost-panel.active { display: block; }

    /* MAG WEL — kaartjes */
    .wel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.75rem;
    }
    .wel-kaart {
      background: white;
      border: 1px solid var(--fog);
      border-radius: 4px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .wel-naam {
      font-size: 0.9rem;
      font-weight: 400;
      color: #3a3020;
      line-height: 1.3;
    }
    .wel-tijd {
      font-size: 0.78rem;
      font-weight: 300;
      color: #7a6a50;
    }
    .wel-balk-wrap {
      height: 4px;
      background: var(--fog);
      border-radius: 2px;
      overflow: hidden;
    }
    .wel-balk {
      height: 100%;
      border-radius: 2px;
    }

    /* MAG NIET — groepen */
    .niet-groep {
      margin-bottom: 2rem;
    }
    .niet-groep-titel {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--moss);
      margin-bottom: 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--fog);
    }
    .niet-item {
      display: flex;
      gap: 1rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--fog);
      align-items: flex-start;
    }
    .niet-item:last-child { border-bottom: none; }
    .niet-icon {
      font-size: 1.1rem;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }
    .niet-naam {
      font-size: 0.95rem;
      font-weight: 400;
      color: #3a3020;
      margin-bottom: 0.2rem;
    }
    .niet-reden {
      font-size: 0.85rem;
      font-weight: 300;
      color: #7a6a50;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .wel-grid { grid-template-columns: 1fr 1fr; }
      .compost-tab { padding: 0.6rem 1rem; font-size: 0.82rem; }
    }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>
<div style="height:var(--nav-height);"></div>

<header class="page-header" style="padding-bottom:2.5rem;">
  <div class="page-header-inner">
    <h1 class="page-title">Wat mag op de composthoop?</h1>
    <p class="page-lead">Zoek wat je wil composteren en ontdek of het mag — en hoe lang het duurt.</p>
  </div>
</header>

<main>
  <div class="compost-wrap">

    <div class="compost-search-wrap">

      <div class="compost-search-result" id="compostResult"></div>
    </div>

    <!-- Tabbladen -->
    <div class="compost-tabs">
      <button class="compost-tab active" data-tab="wel">✅ Mag wel</button>
      <button class="compost-tab" data-tab="niet">❌ Mag niet</button>
    </div>

    <!-- MAG WEL -->
    <div class="compost-panel active" id="panel-wel">
      <p style="font-size:0.85rem;color:#7a6a50;margin-bottom:1.5rem;font-weight:300;">
        Gesorteerd op composteertijd — van snel (groen) naar traag (rood). Tijden zijn gemiddelden.

      <div class="wel-grid" id="welGrid"></div>
    </div>

    <!-- MAG NIET -->
    <div class="compost-panel" id="panel-niet">
      <div id="nietGroepen"></div>
    </div>

  </div>

// ── KLEUR op basis van composteertijd ─────────────────────
function tijdKleur(maanden) {
  // groen (snel) → oranje → rood (traag)
  const max = 39;
  const ratio = Math.min(maanden / max, 1);
  if (ratio < 0.3) return '#5C7A3A';       // groen
  if (ratio < 0.6) return '#C8A96E';       // straw/oranje
  return '#8B4513';                         // rood/bruin
}

function tijdLabel(maanden) {
  if (maanden < 1) return Math.round(maanden * 4.33) + ' weken';
  if (maanden === 1) return '1 maand';
  return '± ' + maanden.toFixed(1).replace('.', ',') + ' maanden';
}

// ── RENDER MAG WEL ────────────────────────────────────────
function renderWel() {
  const grid = document.getElementById('welGrid');
  const maxM = 38.8;
  grid.innerHTML = MAG_WEL.map(item => {
    const kleur = tijdKleur(item.maanden);
    const breedte = Math.max(4, Math.round((item.maanden / maxM) * 100));
    return `<div class="wel-kaart">
      <div class="wel-balk-wrap"><div class="wel-balk" style="width:${breedte}%;background:${kleur};"></div></div>
      <div class="wel-naam">${item.naam}</div>
      <div class="wel-tijd" style="color:${kleur};">${tijdLabel(item.maanden)}</div>
    </div>`;
  }).join('');
}

// ── RENDER MAG NIET ───────────────────────────────────────
function renderNiet() {
  const wrap = document.getElementById('nietGroepen');
  wrap.innerHTML = MAG_NIET.map(groep => `
    <div class="niet-groep">
      <div class="niet-groep-titel">${groep.groep}</div>
      ${groep.items.map(item => `
        <div class="niet-item">
          <div class="niet-icon">❌</div>
          <div>
            <div class="niet-naam">${item.naam}</div>
            <div class="niet-reden">${item.reden}</div>
          </div>
        </div>`).join('')}
    </div>`).join('');
}

// ── ZOEKEN ────────────────────────────────────────────────
function zoek(query) {
  const q = query.toLowerCase().trim();
  if (!q) return null;

  // Zoek via synoniemen
  const synTarget = SYNONIEMEN[q];

  // Zoek in mag wel
  const welMatch = MAG_WEL.find(item =>
    item.naam.toLowerCase().includes(q) ||
    (synTarget && item.naam === synTarget)
  );
  if (welMatch) return {type:'ja', item: welMatch};

  // Zoek in mag niet
  for (const groep of MAG_NIET) {
    const nietMatch = groep.items.find(item =>
      item.naam.toLowerCase().includes(q) ||
      (synTarget && item.naam === synTarget)
    );
    if (nietMatch) return {type:'nee', item: nietMatch, groep: groep.groep};
  }

  return {type:'niets'};
}

document.getElementById('compostSearch').addEventListener('input', function() {
  const resultEl = document.getElementById('compostResult');
  const val = this.value.trim();
  if (!val) { resultEl.style.display = 'none'; return; }

  const res = zoek(val);
  resultEl.style.display = 'block';
  resultEl.className = 'compost-search-result';

  if (!res || res.type === 'niets') {
    resultEl.classList.add('niets');
    resultEl.innerHTML = '🤔 Niet gevonden. Probeer een ander woord.';
  } else if (res.type === 'ja') {
    resultEl.classList.add('ja');
    resultEl.innerHTML = `✅ <strong>${res.item.naam}</strong> mag op de composthoop — duurt ${tijdLabel(res.item.maanden)}.`;

    resultEl.classList.add('nee');
    resultEl.innerHTML = `❌ <strong>${res.item.naam}</strong> mag <em>niet</em> op de composthoop.<br><span style="font-size:0.88rem;">${res.item.reden}</span>`;
  }
});

// ── TABBLADEN ─────────────────────────────────────────────

    document.querySelectorAll('.compost-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.compost-panel').forEach(p => p.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('panel-' + this.dataset.tab).classList.add('active');
  });
});
